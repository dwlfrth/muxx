# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/user/application_security/sast/#available-cicd-variables
# Secret Detection customization: https://docs.gitlab.com/user/application_security/secret_detection/pipeline/configure/
# Dependency Scanning customization: https://docs.gitlab.com/user/application_security/dependency_scanning/dependency_scanning_sbom/#customizing-analyzer-behavior
# Container Scanning customization: https://docs.gitlab.com/user/application_security/container_scanning/#customizing-analyzer-behavior
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ci/variables/#cicd-variable-precedence
stages:
- test
- secret-detection

# Branch pipelines only: without this, the jobs' catch-all rule would also add
# a merge request pipeline to every push to an MR branch, running everything
# twice. No tag pipelines: a release tag is on a commit main already tested, and
# GitHub builds the image. To save compute minutes, branches run only "checks"
# and secret detection: GitHub Actions runs upstream's build and tests (what
# "gates" does) for free on every push there. Main also runs gates, race and
# SAST, after the merge.
workflow:
  rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    when: never
  - if: $CI_COMMIT_TAG
    when: never
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  - variables:
      SAST_DISABLED: "true"

# Jobs that only run on main.
.main-only:
  rules:
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
sast:
  stage: test
include:
- template: Security/SAST.gitlab-ci.yml
- template: Security/Secret-Detection.gitlab-ci.yml
secret_detection:
  stage: secret-detection

# The project runs this file from main for every branch (CI/CD configuration
# file ".gitlab-ci.yml@<group>/muxx:main"), so feature branches from upstream,
# which have no CI file, get pipelines too. A branch with its own, changed
# version of this file is tested with that version instead: "ci-changes" runs it
# as a child pipeline, and "checks", which extends .skip-when-ci-changes, skips
# itself in the parent, so it runs once. Upstream-based branches lack the file,
# hence "exists".
.skip-when-ci-changes:
  rules:
  - if: $CI_PIPELINE_SOURCE != "parent_pipeline"
    exists:
    - .gitlab-ci.yml
    changes:
      paths:
      - .gitlab-ci.yml
      compare_to: refs/heads/main
    when: never
  - when: on_success

ci-changes:
  stage: test
  rules:
  - if: $CI_PIPELINE_SOURCE != "parent_pipeline" && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
    exists:
    - .gitlab-ci.yml
    changes:
      paths:
      - .gitlab-ci.yml
      compare_to: refs/heads/main
  trigger:
    include:
    - project: $CI_PROJECT_PATH
      ref: $CI_COMMIT_SHA
      file: .gitlab-ci.yml
    strategy: depend

# Same steps as upstream's .github/workflows/build-test.yml, on Go stable and
# oldstable with Node 24. The Makefile runs npm ci itself when needed. Main
# only: on branches, GitHub Actions runs upstream's workflow.
gates:
  extends: .main-only
  stage: test
  image: golang:${GO_VERSION}-trixie
  parallel:
    matrix:
    - GO_VERSION: ["1.27", "1.26"]
  variables:
    NODE_VERSION: v24.22.3
    NODE_SHA256: 4f2b175a6d53a5c617a80dba2676238a0688cef28c6da4eba35c7d844e66fcfb
  before_script:
  - apt-get update -qq && apt-get install -y -qq xz-utils >/dev/null
  - curl -fsSLo /tmp/node.tar.xz "https://nodejs.org/dist/$NODE_VERSION/node-$NODE_VERSION-linux-x64.tar.xz"
  - echo "$NODE_SHA256  /tmp/node.tar.xz" | sha256sum -c -
  - tar -xJf /tmp/node.tar.xz -C /usr/local --strip-components=1
  script:
  - touch */*.ts
  - make build
  - mkdir -p tmp && TMPDIR=$PWD/tmp make test
  - make fmt
  - git diff --exit-code

# Beyond upstream's CI: the checks of upstream's "make check", with pinned
# versions, the vulnerability scan, and actionlint on muxx's own workflow, all
# blocking. staticcheck skips SA1019: its findings are deprecations in upstream's
# code (CLAUDE.md, "Do not fix"). actionlint checks the workflow's shell scripts
# only when shellcheck is installed, hence the install. Branches from upstream
# don't have the workflow, so both are skipped there.
checks:
  extends: .skip-when-ci-changes
  stage: test
  image: golang:1.27-trixie
  variables:
    CGO_ENABLED: "0"
  script:
  - go vet ./...
  - GOOS=linux GOARCH=386 go vet ./...
  - go run github.com/gordonklaus/ineffassign@v0.1.0 ./...
  - go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 -checks inherit,-SA1019 ./...
  - go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
  - |
    if [ -f .github/workflows/muxx-image.yml ]; then
      apt-get update -qq && apt-get install -y -qq shellcheck >/dev/null
      go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/muxx-image.yml
    else
      echo "no muxx image workflow on this branch, actionlint skipped"
    fi

# The whole test suite under the race detector, with upstream's target. Go
# stable only, to save compute minutes; oldstable is covered by "gates". Main
# only, also to save compute minutes.
race:
  extends: .main-only
  stage: test
  image: golang:1.27-trixie
  script:
  - mkdir -p tmp && TMPDIR=$PWD/tmp make test-race
